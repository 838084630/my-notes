<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- 外圈渐变背景 -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 圆形背景 -->
  <circle cx="50" cy="50" r="48" fill="url(#bgGradient)"/>
  
  <!-- 内部白色圆圈 -->
  <circle cx="50" cy="50" r="40" fill="white"/>
  
  <!-- 笔记图标 -->
  <g transform="translate(50, 50)">
    <!-- 笔记本 -->
    <rect x="-12" y="-16" width="20" height="28" fill="none" stroke="#667eea" stroke-width="2" rx="1"/>
    
    <!-- 笔记本左边装订线 -->
    <line x1="-6" y1="-16" x2="-6" y2="12" stroke="#667eea" stroke-width="1.5" stroke-dasharray="2,2"/>
    
    <!-- 笔记本内容线 -->
    <line x1="-10" y1="-10" x2="6" y2="-10" stroke="#667eea" stroke-width="1" opacity="0.6"/>
    <line x1="-10" y1="-5" x2="6" y2="-5" stroke="#667eea" stroke-width="1" opacity="0.6"/>
    <line x1="-10" y1="0" x2="6" y2="0" stroke="#667eea" stroke-width="1" opacity="0.6"/>
    <line x1="-10" y1="5" x2="6" y2="5" stroke="#667eea" stroke-width="1" opacity="0.6"/>
    
    <!-- 笔 -->
    <line x1="8" y1="-8" x2="14" y2="-14" stroke="#764ba2" stroke-width="2.5" stroke-linecap="round"/>
    <!-- 笔尖 -->
    <polygon points="14,-14 16,-12 12,-10" fill="#764ba2"/>
  </g>
</svg>